<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕骑单车 · SVG 2D 动画</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }

  html, body { min-height: 100%; }

  body {
    margin: 0;
    padding: 28px 20px 34px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    background:
      radial-gradient(900px 520px at 50% -10%, #3a2b52 0%, transparent 70%),
      radial-gradient(700px 420px at 50% 110%, #4a2233 0%, transparent 70%),
      #0b0812;
    color: #f4e8da;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
                 system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  .hud { text-align: center; }

  .hud h1 {
    margin: 0;
    font-size: clamp(20px, 3.4vw, 30px);
    letter-spacing: .18em;
    font-weight: 600;
    background: linear-gradient(100deg, #ffd9a8, #ff9f7a 55%, #b98ee8);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .hud p {
    margin: 8px 0 0;
    font-size: 12px;
    letter-spacing: .32em;
    color: rgba(244, 232, 218, .45);
    text-transform: uppercase;
  }

  .stage {
    width: min(960px, 100%);
    border-radius: 26px;
    overflow: hidden;
    background: #2b2340;
    box-shadow:
      0 0 0 1px rgba(255, 255, 255, .08),
      0 40px 90px -50px #000,
      0 0 140px -50px rgba(255, 150, 110, .55);
  }

  .stage svg { display: block; width: 100%; height: auto; }

  .note {
    margin: 0;
    font-size: 12px;
    letter-spacing: .12em;
    color: rgba(244, 232, 218, .38);
  }

  /* ---------- 背景与装饰动画 ---------- */
  @keyframes drift {
    from { transform: translateX(-40px); }
    to   { transform: translateX(980px); }
  }
  @keyframes sunPulse {
    0%, 100% { transform: scale(1); opacity: .88; }
    50%      { transform: scale(1.07); opacity: 1; }
  }
  @keyframes roadScroll {
    from { stroke-dashoffset: 0; }
    to   { stroke-dashoffset: 130; }
  }
  @keyframes roadScrollSlow {
    from { stroke-dashoffset: 0; }
    to   { stroke-dashoffset: 94; }
  }
  @keyframes streakMove {
    0%   { transform: translateX(40px); opacity: 0; }
    22%  { opacity: .6; }
    100% { transform: translateX(-190px); opacity: 0; }
  }
  @keyframes blink {
    0%, 90%, 96%, 100% { transform: scaleY(.03); }
    93%                { transform: scaleY(1); }
  }

  .drift-a { animation: drift 54s linear infinite; }
  .drift-b { animation: drift 78s linear infinite; animation-delay: -30s; }
  .drift-c { animation: drift 96s linear infinite; animation-delay: -70s; }

  .sun-glow {
    transform-box: fill-box;
    transform-origin: center;
    animation: sunPulse 7.5s ease-in-out infinite;
  }

  #roadDashes     { animation: roadScroll .62s linear infinite; }
  #roadDashesSlow { animation: roadScrollSlow .95s linear infinite; }

  .streak   { animation: streakMove 1.2s linear infinite; }
  .streak-b { animation-delay: -.45s; }
  .streak-c { animation-delay: -.8s; }

  #eyelid {
    transform-box: fill-box;
    transform-origin: center;
    transform: scaleY(.03);
    animation: blink 5.4s ease-in-out infinite;
  }

  @media (prefers-reduced-motion: reduce) {
    .drift-a, .drift-b, .drift-c, .sun-glow, .streak,
    #roadDashes, #roadDashesSlow, #eyelid { animation: none; }
  }
</style>
</head>

<p class="note">纯 SVG + CSS + 原生 JS 绘制，无任何外部素材</p>

<script>
(() => {
  'use strict';

  const NS = 'http://www.w3.org/2000/svg';
  const $ = (id) => document.getElementById(id);
  const TAU = Math.PI * 2;
  const deg = (rad) => (rad * 180) / Math.PI;

  /* ---------- 与 SVG 对齐的几何参数 ---------- */
  const BB = { x: 430, y: 430 };     // 中轴
  const CRANK = 32;                  // 曲柄长度
  const HIP = { x: 396, y: 318 };    // 髋关节
  const THIGH = 82;                  // 大腿
  const SHIN = 78;                   // 小腿
  const SPEED = { crank: 3.1, wheel: 8.4 };

  const wheels = [
    { el: $('rearSpin'),  x: 300, y: 430 },
    { el: $('frontSpin'), x: 580, y: 430 },
  ];

  const els = {
    pelican: $('pelican'),
    head: $('headGroup'),
    farWing: $('farWing'),
    scarf: $('scarfTail'),
    chainring: $('chainring'),
    crankNear: $('crankNear'),
    crankFar: $('crankFar'),
    pedalNear: $('pedalNear'),
    pedalFar: $('pedalFar'),
    footNear: $('footNear'),
    footFar: $('footFar'),
    thighNear: $('thighNear'),
    shinNear: $('shinNear'),
    thighFar: $('thighFar'),
    shinFar: $('shinFar'),
  };

  /* ---------- 代码生成辐条 ---------- */
  function buildSpokes(group, cx, cy) {
    for (let i = 0; i < 12; i += 1) {
      const a = (i / 12) * TAU;
      const line = document.createElementNS(NS, 'line');
      line.setAttribute('x1', (cx + Math.cos(a) * 10).toFixed(1));
      line.setAttribute('y1', (cy + Math.sin(a) * 10).toFixed(1));
      line.setAttribute('x2', (cx + Math.cos(a) * 61).toFixed(1));
      line.setAttribute('y2', (cy + Math.sin(a) * 61).toFixed(1));
      line.setAttribute('stroke', '#e7d6b8');
      line.setAttribute('stroke-width', '2.2');
      line.setAttribute('opacity', '.85');
      group.appendChild(line);
    }
  }
  buildSpokes(wheels[0].el, 300, 430);
  buildSpokes(wheels[1].el, 580, 430);

  /* ---------- 工具函数 ---------- */
  const pedalPos = (angle) => ({
    x: BB.x + Math.cos(angle) * CRANK,
    y: BB.y + Math.sin(angle) * CRANK,
  });

  // 两段式 IK：髋 -> 膝 -> 踝，膝盖朝前（+x）
  function solveKnee(hip, ankle) {
    const dx = ankle.x - hip.x;
    const dy = ankle.y - hip.y;
    const raw = Math.hypot(dx, dy) || 0.001;
    const ux = dx / raw;
    const uy = dy / raw;
    const d = Math.min(Math.max(raw, Math.abs(THIGH - SHIN) + 1), THIGH + SHIN - 1);
    const along = (THIGH * THIGH - SHIN * SHIN + d * d) / (2 * d);
    const out = Math.sqrt(Math.max(0, THIGH * THIGH - along * along));
    return {
      x: hip.x + ux * along + uy * out,
      y: hip.y + uy * along - ux * out,
    };
  }

  function poseLeg(thighEl, shinEl, hip, ankle, knee) {
    thighEl.setAttribute('x1', hip.x.toFixed(1));
    thighEl.setAttribute('y1', hip.y.toFixed(1));
    thighEl.setAttribute('x2', knee.x.toFixed(1));
    thighEl.setAttribute('y2', knee.y.toFixed(1));
    shinEl.setAttribute('x1', knee.x.toFixed(1));
    shinEl.setAttribute('y1', knee.y.toFixed(1));
    shinEl.setAttribute('x2', ankle.x.toFixed(1));
    shinEl.setAttribute('y2', ankle.y.toFixed(1));
  }

  function poseCrank(el, p) {
    el.setAttribute('x2', p.x.toFixed(1));
    el.setAttribute('y2', p.y.toFixed(1));
  }

  // 围巾飘带：带正弦波的丝带
  function scarfPath(t) {
    const N = 20;
    const top = [];
    const bottom = [];
    for (let i = 0; i <= N; i += 1) {
      const u = i / N;
      const x = 445 - u * 168;
      const y = 241 + u * 14 + Math.sin(u * 3.2 - t * 6.2) * 16 * (0.25 + u);
      const w = 10 * (1 - u * 0.72);
      top.push([x, y - w]);
      bottom.push([x, y + w]);
    }
    let d = `M${top[0][0].toFixed(1)} ${top[0][1].toFixed(1)}`;
    for (let i = 1; i <= N; i += 1) d += `L${top[i][0].toFixed(1)} ${top[i][1].toFixed(1)}`;
    for (let i = N; i >= 0; i -= 1) d += `L${bottom[i][0].toFixed(1)} ${bottom[i][1].toFixed(1)}`;
    return `${d}Z`;
  }

  /* ---------- 渲染 ---------- */
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const state = { crank: 1.1, wheel: 0, clock: 0 };

  function render() {
    // 身体起伏：踩一圈起伏两次
    const bob = Math.sin(state.crank * 2 + 0.6) * 2.2;
    const hip = { x: HIP.x, y: HIP.y + bob };

    // 车轮与齿盘
    const wheelDeg = deg(state.wheel).toFixed(1);
    wheels.forEach((w) => {
      w.el.setAttribute('transform', `rotate(${wheelDeg} ${w.x} ${w.y})`);
    });
    els.chainring.setAttribute('transform', `rotate(${deg(state.crank).toFixed(1)} 430 430)`);

    // 身体 / 头 / 翅膀 / 围巾
    els.pelican.setAttribute('transform', `translate(0 ${bob.toFixed(2)})`);
    els.head.setAttribute('transform',
      `rotate(${(Math.sin(state.crank * 2 - 0.5) * 1.8).toFixed(2)} 455 250)`);
    els.farWing.setAttribute('transform',
      `rotate(${(Math.sin(state.clock * 2.4) * 9 - 4).toFixed(2)} 442 252)`);
    els.scarf.setAttribute('d', scarfPath(state.clock));

    // 踏板与曲柄
    const pNear = pedalPos(state.crank);
    const pFar = pedalPos(state.crank + Math.PI);
    const ankleNear = { x: pNear.x, y: pNear.y - 12 };
    const ankleFar = { x: pFar.x, y: pFar.y - 12 };

    poseCrank(els.crankNear, pNear);
    poseCrank(els.crankFar, pFar);

    els.pedalNear.setAttribute('transform', `translate(${pNear.x.toFixed(1)} ${pNear.y.toFixed(1)})`);
    els.pedalFar.setAttribute('transform', `translate(${pFar.x.toFixed(1)} ${pFar.y.toFixed(1)})`);
    els.footNear.setAttribute('transform', `translate(${pNear.x.toFixed(1)} ${pNear.y.toFixed(1)})`);
    els.footFar.setAttribute('transform', `translate(${pFar.x.toFixed(1)} ${pFar.y.toFixed(1)})`);

    // 双腿 IK
    poseLeg(els.thighNear, els.shinNear, hip, ankleNear, solveKnee(hip, ankleNear));
    poseLeg(els.thighFar, els.shinFar, hip, ankleFar, solveKnee(hip, ankleFar));
  }

  /* ---------- 主循环 ---------- */
  let last = performance.now();

  function tick(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    state.crank += SPEED.crank * dt;
    state.wheel += SPEED.wheel * dt;
    state.clock += dt;
    render();
    requestAnimationFrame(tick);
  }

  render();
  if (!reduceMotion) requestAnimationFrame(tick);
})();
</script>
</body>
</html>
